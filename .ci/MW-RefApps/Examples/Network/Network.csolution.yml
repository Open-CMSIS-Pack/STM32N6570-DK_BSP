solution:
  description: Network examples supported by STM32N6570-DK
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:

  select-compiler:
    - compiler: AC6

  target-types:
    # - type: <target_name>
    #   board: <board_name>
    #   variables:
    #     - Board-Layer: <board_layer>.clayer.yml

  build-types:
    - type: Debug
      debug: on
      optimize: debug
    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: BSD_Client/BSD_Client.cproject.yml
    - project: BSD_Server/BSD_Server.cproject.yml
  # - project: FTP_Server/FTP_Server.cproject.yml        # Unsupported: SD card
    - project: HTTP_Server/HTTP_Server.cproject.yml
  # - project: HTTP_Upload/HTTP_Upload.cproject.yml      # Unsupported: SD card
  # - project: HTTPS_Server/HTTPS_Server.cproject.yml    # Unsupported: FSBL RAM too low
    - project: SMTP_Client/SMTP_Client.cproject.yml
  # - project: SMTPS_Client/SMTPS_Client.cproject.yml    # Unsupported: FSBL RAM too low
    - project: SNMP_Agent/SNMP_Agent.cproject.yml
    - project: Telnet_Server/Telnet_Server.cproject.yml
