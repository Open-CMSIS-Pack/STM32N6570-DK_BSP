solution:
  description: USB Device examples supported by STM32N6570-DK
  created-for: CMSIS-Toolbox@2.6.0
  cdefault:

  select-compiler:
    - compiler: AC6

  target-types:
    # - type: <target_name>
    #   board: <board_name>
    #   variables:
    #     - Board-Layer: <board_layer>.clayer.yml

  build-types:
    - type: Debug
      debug: on
      optimize: debug
    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: HID/HID.cproject.yml
    - project: MassStorage/MassStorage.cproject.yml
  # - project: VirtualCOM/VirtualCOM.cproject.yml  # Unsupported: CMSIS_USART
